<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Solace</title>
<link rel="stylesheet" href="../../assets/solace.css">
</head>
<body>

<div class="wizard">
  <div class="wizard-top">
    <a class="back-link" href="../confirm/" data-testid="back">‹ Back</a>
    <div class="logo-mark">S</div>
  </div>
  <div class="progress"><div class="progress-fill" style="width:90%"></div></div>

  <div class="wizard-body">
    <form id="step-form" data-next="covered" novalidate>
      <h1 class="step-title">Help us find you.</h1>
      <p class="step-sub">
        We’ll need your Medicare Beneficiary Identifier (MBI) to finish confirming your coverage.
      </p>

      <div class="s-field">
        <label for="mbi">
          Medicare Beneficiary Identifier <span class="req">*</span>
          <a href="#" style="font-weight:400;margin-left:8px">(What’s this?)</a>
        </label>
        <input class="s-input" type="text" id="mbi" name="mbi" data-testid="mbi"
               placeholder="Medicare Beneficiary Identifier" maxlength="20" autocomplete="off">
      </div>

      <a class="help-link" href="#">I don’t have my insurance card <span aria-hidden="true">→</span></a>

      <div class="cta-wrap">
        <button type="submit" class="cta" id="step-continue" data-testid="submit-mbi">
          Submit <span aria-hidden="true">→</span>
        </button>
      </div>
    </form>
  </div>

  <div class="secure-note">🔒 All information you share is secure and confidential</div>
</div>

<script src="../../assets/data.js"></script>
<script src="../../assets/solace.js"></script>
</body>
</html>
