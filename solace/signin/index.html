<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Login | Solace Health</title>
<link rel="stylesheet" href="../../assets/solace.css">
</head>
<body>

<div class="auth-page">
  <div class="auth-card">
    <div class="logo-mark">S</div>

    <h1 class="auth-title">Welcome!</h1>
    <p class="auth-sub">Please sign in if you’re an existing Solace patient.</p>

    <a class="cta cta-full" href="../auth/" id="sign-in" data-testid="sign-in">
      Sign In
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" stroke="currentColor"
              stroke-width="2" stroke-linecap="round"/>
        <path d="M10 17l5-5-5-5M15 12H3" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>

    <p class="auth-foot">
      Not a patient yet? <a href="../" data-testid="check-eligibility">Check eligibility</a>
    </p>
  </div>
</div>

<script src="../../assets/data.js"></script>
<script src="../../assets/solace.js"></script>
</body>
</html>
